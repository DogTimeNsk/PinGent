<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pingent</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main class="shell">
      <section id="login-panel" class="panel narrow">
        <h1>Pingent</h1>
        <p>Sign in to this local installation.</p>
        <form id="login-form">
          <label>Username <input id="username" autocomplete="username" required></label>
          <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
          <button>Sign in</button>
        </form>
      </section>
      <section id="app-panel" hidden>
        <header>
          <div><h1>Pingent</h1><p id="identity"></p></div>
          <button id="logout" class="secondary">Sign out</button>
        </header>
        <p id="notice" role="status"></p>
        <div class="grid">
          <section class="panel">
            <h2>Workspace</h2>
            <select id="workspace"></select>
            <p id="session-state"></p>
            <button id="reset-session" class="secondary">Start a new session</button>
          </section>
          <section class="panel">
            <h2>New task</h2>
            <form id="task-form">
              <textarea id="prompt" rows="7" placeholder="Describe the task for Codex…" required></textarea>
              <button>Queue task</button>
            </form>
          </section>
        </div>
        <section class="panel"><h2>Current queue</h2><div id="tasks" class="task-list"></div></section>
        <section class="panel"><h2>Recent tasks</h2><div id="history" class="task-list"></div></section>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
